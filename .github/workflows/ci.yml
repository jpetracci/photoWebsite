name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python syntax + import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q app wsgi.py

      - name: Import app (smoke test)
        env:
          SECRET_KEY: ci-test
          DATABASE: /tmp/ci.db
          UPLOAD_DIR: /tmp/ci-uploads
          THUMB_DIR: /tmp/ci-thumbs
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin
        run: |
          python -c "from app import create_app; app = create_app(); \
            print('routes:', sorted(str(r) for r in app.url_map.iter_rules()))"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: photowebsite:ci
