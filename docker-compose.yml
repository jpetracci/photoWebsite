services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      HOME_RANDOM_COUNT: 12
    volumes:
      - photo_data:/data
    restart: unless-stopped

volumes:
  photo_data:
